name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify release version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Release tag must match manifest version v${version}."
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Validate manifest
        run: go run . manifest >/dev/null

      - name: Build binaries and package releases with source
        run: make package

      - name: Verify package checksums
        working-directory: dist
        run: sha256sum -c checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trakt-community-release
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trakt-community-release
          path: dist

      - name: Publish in this repository
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
